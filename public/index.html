<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Wi-Fi Access</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 380px; margin: auto; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .qr-box { margin: 15px 0; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .qr-box img { width: 170px; height: 170px; border-radius: 8px; }
        .input-group { margin: 15px 0; text-align: left; }
        .input-group label { font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn { background: #28a745; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .btn-blue { background: #007bff; }
        .btn:disabled { background: #ccc; }
        #tokenDisplay { font-size: 22px; font-weight: bold; color: #007bff; margin: 10px 0; }
        .status { font-size: 14px; color: #666; margin-top: 10px; }
        .timer { font-size: 26px; font-weight: bold; color: #28a745; margin-top: 15px; }
        #connectSection { display: none; margin-top: 15px; border-top: 2px dashed #eee; padding-top: 15px; }
        #wifiDetailsBox { display: none; margin-top: 15px; background: #eef9f1; padding: 15px; border-radius: 8px; border: 1px solid #c3e6cb; }
        .wifi-info { font-size: 14px; text-align: left; margin: 10px 0; background: #fff; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>College Wi-Fi Access</h2>
        <p>Pay <b>₹1</b> to get high-speed internet for 15 minutes.</p>
        
        <!-- Payment Section -->
        <div id="paymentSection">
            <div class="qr-box">
                <img id="upiQr" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=YOUR_UPI_ID%26pn=CollegeWiFi%26am=1%26cu=INR" alt="UPI QR Code">
                <p><small>Scan via Google Pay / PhonePe / Paytm</small></p>
            </div>

            <div class="input-group">
                <label for="utrInput">Enter 12-Digit UTR / Transaction ID:</label>
                <input type="number" id="utrInput" placeholder="e.g. 421589630124">
            </div>

            <button class="btn" id="payBtn" onclick="verifyPayment()">Verify Payment & Get Access</button>
        </div>

        <!-- Connection Section -->
        <div id="connectSection">
            <p style="color: green; font-weight: bold; margin-bottom: 5px;">Payment Verified!</p>
            <div id="tokenDisplay"></div>
            <button class="btn btn-blue" id="connectBtn" onclick="activateInternet()">Unlock Wi-Fi Connection</button>
        </div>

        <!-- Hotspot QR & Details Box (Unlocks on click) -->
        <div id="wifiDetailsBox">
            <h3 style="color: #155724; margin: 0 0 10px 0;">Wi-Fi Access Granted! 🎉</h3>
            <p style="font-size: 13px; color: #155724; margin: 0;">Scan below QR code to connect directly:</p>
            
            <div class="qr-box" style="background: white;">
                <!-- Pro Sniper Mobile Hotspot QR Code -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=WIFI:S:Pro%20Sniper%20Mobile;T:WPA;P:NUMBER123;;" alt="Hotspot QR Code">
            </div>

            <div class="wifi-info">
                <p style="margin: 4px 0;"><b>Network Name (SSID):</b> Pro Sniper Mobile</p>
                <p style="margin: 4px 0;"><b>Password:</b> NUMBER123</p>
            </div>
        </div>

        <div id="status" class="status"></div>
        <div id="timerDisplay" class="timer"></div>
    </div>

    <script>
        let generatedToken = "";

        async function verifyPayment() {
            const utr = document.getElementById('utrInput').value.trim();
            const btn = document.getElementById('payBtn');
            const status = document.getElementById('status');

            if (!utr || utr.length !== 12) {
                status.style.color = "red";
                status.innerText = "Please enter a valid 12-digit UTR.";
                return;
            }

            btn.disabled = true;
            status.style.color = "#666";
            status.innerText = "Verifying UTR with server...";

            try {
                const response = await fetch('/api/verify-utr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ utr: utr })
                });

                const data = await response.json();

                if (response.ok && data.status === "success") {
                    status.innerText = "";
                    generatedToken = data.token;
                    
                    document.getElementById('tokenDisplay').innerText = "Token: " + generatedToken;
                    document.getElementById('paymentSection').style.display = "none";
                    document.getElementById('connectSection').style.display = "block";
                } else {
                    status.style.color = "red";
                    status.innerText = data.message || "Verification failed.";
                    btn.disabled = false;
                }
            } catch (err) {
                status.style.color = "red";
                status.innerText = "Server error. Please try again.";
                btn.disabled = false;
            }
        }

        async function activateInternet() {
            const status = document.getElementById('status');
            const btn = document.getElementById('connectBtn');

            btn.disabled = true;
            status.style.color = "#666";
            status.innerText = "Activating session...";

            try {
                const response = await fetch('/api/check-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: generatedToken })
                });

                const data = await response.json();

                if (response.ok && data.valid) {
                    status.innerText = "";
                    document.getElementById('connectSection').style.display = "none";
                    document.getElementById('wifiDetailsBox').style.display = "block";
                    
                    startTimer(data.timeRemainingSeconds);
                } else {
                    status.style.color = "red";
                    status.innerText = data.message || "Invalid Token!";
                    btn.disabled = false;
                }
            } catch (err) {
                status.style.color = "red";
                status.innerText = "Server error. Please try again.";
                btn.disabled = false;
            }
        }

        function startTimer(seconds) {
            let timer = seconds;
            const timerDisplay = document.getElementById('timerDisplay');

            const interval = setInterval(() => {
                const minutes = Math.floor(timer / 60);
                const secs = timer % 60;

                timerDisplay.innerText = `${minutes}:${secs < 10 ? '0' : ''}${secs} Left`;

                if (--timer < 0) {
                    clearInterval(interval);
                    timerDisplay.style.color = "red";
                    timerDisplay.innerText = "15 Mins Over! Access Expired.";
                    document.getElementById('wifiDetailsBox').style.display = "none";
                }
            }, 1000);
        }
    </script>
</body>
</html>
